<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pastelito Logo Animation</title>
<!-- Animated "Pastelito Scents" logo. Open in a browser to preview; it loops.
     For recording, add ?capture to the address and drive window.render(t). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: var(--bg); overflow: hidden; }
  svg { width: min(100vw, 100vh); height: auto; display: block; }
  :root {
    --bg: #FEFDFB; --ink: #0B0B0B;
    --gold: #B89961; --gold-light: #D3B67E; --gold-pale: #E3CDA0;
  }
  :root.dark {
    --bg: #1B1A17; --ink: #F3EBDD;
    --gold: #C9A96E; --gold-light: #DCC08A; --gold-pale: #EBD8B0;
  }
  .scents { font-family: "Cinzel", serif; font-weight: 500; font-size: 44px; fill: var(--gold); }
</style>
</head>

      <stop offset="0.5" stop-color="var(--gold-light)"/>
      <stop offset="1" stop-color="var(--gold-pale)"/>

    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>

      <line id="ruleR" x1="680" y1="806" x2="680" y2="806" stroke="var(--gold)" stroke-width="2.5"/>

    </g>

</svg>

<script>
  const DURATION = 6.5
  const $ = (id) => document.getElementById(id)
  const clamp = (v) => Math.min(1, Math.max(0, v))
  // Progress of a step that runs from a to b seconds.
  const span = (t, a, b) => clamp((t - a) / (b - a))
  const easeOut = (p) => 1 - Math.pow(1 - p, 3)
  const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2)
  const easeBack = (p) => { const c = 1.9; return p === 0 ? 0 : 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2) }
  const pop = (el, cx, cy, p) => {
    const s = easeBack(p)
    el.setAttribute("transform", `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`)
    el.setAttribute("opacity", p > 0 ? 1 : 0)
  }

  // Draws the frame at t seconds. Every frame depends only on t.
  window.render = (t) => {
    const settle = easeOut(span(t, 0, DURATION))
    $("all").setAttribute("transform", `translate(540 540) scale(${0.965 + 0.035 * settle}) translate(-540 -540)`)

    $("cap").setAttribute("stroke-dashoffset", 1 - easeInOut(span(t, 0.3, 0.95)))
    $("body").setAttribute("stroke-dashoffset", 1 - easeInOut(span(t, 0.55, 1.75)))

    const c = easeInOut(span(t, 1.35, 2.25))
    $("crescentWipe").setAttribute("x", 262 - 240 * c)
    $("crescentWipe").setAttribute("width", 480 * c)

    $("highlightWipe").setAttribute("height", 260 * easeInOut(span(t, 1.8, 2.4)))
    pop($("capDot"), 248, 211, span(t, 2.0, 2.35))
    $("capLine").setAttribute("stroke-dashoffset", 1 - easeOut(span(t, 2.05, 2.4)))

    const m = easeOut(span(t, 2.3, 2.95))
    $("mistWipe").setAttribute("y", 156 - 100 * m)
    $("mistWipe").setAttribute("height", 100 * m)
    pop($("dot1"), 378, 64, span(t, 2.75, 3.1))
    pop($("dot2"), 425, 50, span(t, 2.9, 3.25))

    const w = easeInOut(span(t, 2.95, 4.45))
    $("wordWipe").setAttribute("transform", `translate(${-200 + w * 1300} 0)`)

    const s = easeOut(span(t, 4.25, 5.15))
    $("scentsGroup").setAttribute("opacity", s)
    $("scents").setAttribute("letter-spacing", 4 + 10 * s)
    const r = easeOut(span(t, 4.4, 5.25))
    $("ruleL").setAttribute("x1", 400 - 125 * r)
    $("ruleR").setAttribute("x2", 680 + 125 * r)

    $("shimmer").setAttribute("x", -200 + 760 * easeInOut(span(t, 5.15, 6.1)))
  }

  if (new URLSearchParams(location.search).has("dark")) document.documentElement.classList.add("dark")
  if (!new URLSearchParams(location.search).has("capture")) {
    // Preview: loop with a short pause on the finished logo.
    const start = performance.now()
    const tick = (now) => {
      render(((now - start) / 1000) % (DURATION + 1.5))
      requestAnimationFrame(tick)
    }
    document.fonts.ready.then(() => requestAnimationFrame(tick))
  } else {
    render(0)
  }
</script>
